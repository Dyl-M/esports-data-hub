version = 1

# Marimo writes each notebook cell as a function it regenerates (all named `_`, no docstring, a closing `return`, a
# bare expression to display a value): left to `marimo check`, as ruff does
exclude_patterns = ["_notebooks/**"]

[[analyzers]]
name = "test-coverage"
enabled = true

[[analyzers]]
name = "python"
enabled = true

  [analyzers.meta]
  runtime_version = "3.x.x"
  max_line_length = 120