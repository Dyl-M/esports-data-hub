name: Release

# Tag main with the next year.month.patch version and open a draft release. The package version is read from that
# tag (hatch-vcs). Polish the draft's notes, then publish it.
on:
  workflow_dispatch:

permissions: { }

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          if git describe --exact-match --tags HEAD > /dev/null 2>&1; then
            echo "::error::main is already tagged ($(git describe --exact-match --tags HEAD)): nothing to release"
            exit 1
          fi
          month="$(date -u +%Y).$(date -u +%-m)"
          last="$(git tag --list "${month}.*" --sort=-v:refname | head -n 1)"
          if [ -z "${last}" ]; then
            next="${month}.0"
          else
            next="${month}.$(( ${last##*.} + 1 ))"
          fi
          echo "tag=${next}" >> "${GITHUB_OUTPUT}"
          echo "Next version: ${next} (previous this month: ${last:-none})"

      - name: Tag main
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "${TAG}" --verify-tag --draft --generate-notes --title "${TAG}"
