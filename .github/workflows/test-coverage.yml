name: Test & Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # On pull requests, test the PR head commit instead of GitHub's temporary merge commit, so the coverage
          # report reaches DeepSource on a commit it knows (push events keep github.sha)
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history with tags: the package version is derived from the latest git tag (hatch-vcs)
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Lint workflow YAML
        run: uvx yamllint -c .github/yamllint.yml .github/workflows/

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy edh

      - name: Run tests with coverage
        run: uv run pytest -m "not integration and not browser" --cov=edh --cov-report=xml --cov-report=term

      - name: Report coverage to DeepSource
        if: github.actor != 'dependabot[bot]'
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        run: |
          curl https://deepsource.io/cli | sh
          ./bin/deepsource report --analyzer test-coverage --key python --value-file ./coverage.xml
